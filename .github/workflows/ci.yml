name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        env:
          RUN_LIVE_TTS_TESTS: "0"
        run: swift test

      - name: Build application bundle
        run: Scripts/package-app.sh

      - name: Verify application bundle
        run: |
          test -x build/release/Speakify.app/Contents/MacOS/Speakify
          codesign --verify --deep --strict build/release/Speakify.app
