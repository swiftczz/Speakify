<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgC2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="dotC2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <filter id="shadowC2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glowC2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="58" y="58" width="908" height="908" rx="214" ry="214" fill="url(#bgC2)" filter="url(#shadowC2)"/>
  <rect x="68" y="68" width="888" height="888" rx="206" ry="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  
  <!-- Concentric full circles -->
  <g fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" filter="url(#glowC2)">
    <circle cx="512" cy="512" r="150" stroke-opacity="0.9"/>
    <circle cx="512" cy="512" r="230" stroke-opacity="0.55"/>
    <circle cx="512" cy="512" r="310" stroke-opacity="0.3"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="512" cy="512" r="45" fill="url(#dotC2)" filter="url(#glowC2)"/>
  
  <circle cx="512" cy="512" r="45" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
</svg>
