<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coreD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadowD" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glowD" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="58" y="58" width="908" height="908" rx="214" ry="214" fill="url(#bgD)" filter="url(#shadowD)"/>
  
  <!-- Inner highlight stroke -->
  <rect x="68" y="68" width="888" height="888" rx="206" ry="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Radiating sound petals -->
  <g fill="#FEF3C7" filter="url(#glowD)" opacity="0.95">
    <!-- Top -->
    <rect x="496" y="212" width="32" height="140" rx="16" ry="16"/>
    <!-- Top-right -->
    <rect x="640" y="280" width="32" height="140" rx="16" ry="16" transform="rotate(45 656 350)"/>
    <!-- Right -->
    <rect x="672" y="496" width="140" height="32" rx="16" ry="16"/>
    <!-- Bottom-right -->
    <rect x="640" y="604" width="32" height="140" rx="16" ry="16" transform="rotate(-45 656 674)"/>
    <!-- Bottom -->
    <rect x="496" y="672" width="32" height="140" rx="16" ry="16"/>
    <!-- Bottom-left -->
    <rect x="352" y="604" width="32" height="140" rx="16" ry="16" transform="rotate(45 368 674)"/>
    <!-- Left -->
    <rect x="212" y="496" width="140" height="32" rx="16" ry="16"/>
    <!-- Top-left -->
    <rect x="352" y="280" width="32" height="140" rx="16" ry="16" transform="rotate(-45 368 350)"/>
  </g>
  
  <!-- Central glowing core -->
  <circle cx="512" cy="512" r="90" fill="url(#coreD)" filter="url(#glowD)"/>
  
  <!-- Inner highlight on core -->
  <circle cx="512" cy="512" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
</svg>
