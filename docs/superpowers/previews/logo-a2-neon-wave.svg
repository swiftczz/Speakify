<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgA2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="waveA2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="shadowA2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glowA2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="58" y="58" width="908" height="908" rx="214" ry="214" fill="url(#bgA2)" filter="url(#shadowA2)"/>
  <rect x="68" y="68" width="888" height="888" rx="206" ry="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Outer subtle ring -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3"/>
  
  <!-- Waveform bars with neon gradient -->
  <g fill="url(#waveA2)" filter="url(#glowA2)">
    <rect x="344" y="442" width="52" height="140" rx="26" ry="26"/>
    <rect x="424" y="382" width="52" height="260" rx="26" ry="26"/>
    <rect x="504" y="322" width="52" height="380" rx="26" ry="26"/>
    <rect x="584" y="382" width="52" height="260" rx="26" ry="26"/>
    <rect x="664" y="442" width="52" height="140" rx="26" ry="26"/>
  </g>
</svg>
