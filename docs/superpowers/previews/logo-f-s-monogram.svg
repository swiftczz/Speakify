<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="waveF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <filter id="shadowF" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="58" y="58" width="908" height="908" rx="214" ry="214" fill="url(#bgF)" filter="url(#shadowF)"/>
  <rect x="68" y="68" width="888" height="888" rx="206" ry="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- S-shaped continuous sound wave -->
  <path d="M 252 512 
           C 252 380 340 330 512 330 
           C 684 330 772 420 772 512 
           C 772 604 684 694 512 694 
           C 340 694 252 644 252 512 
           C 252 470 280 438 330 438 
           C 380 438 408 470 408 512 
           C 408 554 436 586 512 586 
           C 588 586 616 554 616 512 
           C 616 470 588 438 512 438 
           C 436 438 408 470 408 512" 
        fill="none" stroke="url(#waveF)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowF)"/>
  
  <!-- Small highlight dot -->
  <circle cx="512" cy="512" r="24" fill="#FFFFFF" filter="url(#glowF)"/>
</svg>
